<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5079b2"><title>Cloggle Solver</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="mark">C</div><h1>Cloggle Solver</h1></div><button id="theme-toggle" type="button">Dark mode</button></header><section class="panel"><div class="recommendation"><div><strong>Recommended next guess: <span id="suggestion">Loading…</span></strong><div id="score" class="status"></div></div><button id="use-suggestion" type="button" class="primary">Use suggestion</button></div><form id="guess-form"><div class="form-grid"><div><label for="guess-name" class="field-label">Your guess</label><input id="guess-name" class="guess" list="items" autocomplete="off" required placeholder="Enter item name…"><datalist id="items"></datalist></div><div class="feedback" id="feedback"><label class="field"> <span class="field-label">Tradeable</span><input class="toggle" id="tradeable" type="checkbox"></label><div class="field"><span class="field-label">Price</span><div class="price"><label><input type="radio" name="price" value="lower"><span>&lt;</span></label><label><input type="radio" name="price" value="equal" checked><span>=</span></label><label><input type="radio" name="price" value="higher"><span>&gt;</span></label></div></div><label class="field"><span class="field-label">Equipment slot</span><input class="toggle" id="equipment_slot" type="checkbox"></label><label class="field"><span class="field-label">Region</span><input class="toggle" id="region" type="checkbox"></label><label class="field"><span class="field-label">Category</span><input class="toggle" id="category" type="checkbox"></label><label class="field"><span class="field-label">Source</span><input class="toggle" id="source" type="checkbox"></label></div></div><div class="actions"><span id="count" class="count">Loading candidates…</span><span><button class="primary" type="submit">Apply feedback</button> <button id="reset" type="button">Reset</button></span></div></form><div class="table-shell"><table><thead><tr><th>Name</th><th>Tradeable</th><th>Price</th><th>Slot</th><th>Region</th><th>Category</th><th>Source</th></tr></thead><tbody id="candidates"></tbody></table></div></section></main><script type="module" src="./js/app.js"></script></body></html>
